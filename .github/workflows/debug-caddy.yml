name: Debug Caddy

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== CADDYFILE ON DISK ==="
            cat /app/trivio/Caddyfile
            echo ""
            echo "=== CURL /blog/ FROM INSIDE VPS ==="
            curl -sI -H "Host: trivio-ai.com" http://localhost/blog/ | head -15
            echo ""
            echo "=== CURL / FROM INSIDE VPS ==="
            curl -sI -H "Host: trivio-ai.com" http://localhost/ | head -5
