name: Debug Caddy

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== CADDYFILE ON DISK ==="
            cat /app/trivio/Caddyfile
            echo ""
            echo "=== CADDY RUNNING CONFIG (admin API) ==="
            docker exec trivio-caddy-1 wget -qO- http://localhost:2019/config/ 2>/dev/null | head -c 2000 || echo "Admin API not available"
            echo ""
            echo "=== CURL /blog (no slash) FROM INSIDE VPS via HTTP ==="
            curl -sI -H "Host: trivio-ai.com" http://localhost/blog | head -10
            echo ""
            echo "=== CURL /blog/ FROM INSIDE VPS via HTTP ==="
            curl -sI -H "Host: trivio-ai.com" http://localhost/blog/ | head -10
            echo ""
            echo "=== CURL /blog/ via HTTPS FROM INSIDE VPS (skip TLS verify) ==="
            curl -sIk -H "Host: trivio-ai.com" https://localhost/blog/ 2>/dev/null | head -15 || echo "HTTPS curl failed"
            echo ""
            echo "=== FILES IN /var/www/trivio-landing/blog/ ==="
            ls /var/www/trivio-landing/blog/ 2>/dev/null || echo "Directory does not exist"
