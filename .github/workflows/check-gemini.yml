name: Check Gemini env + API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== UPDATING GEMINI_MODEL in .env ==="
            cd /app/trivio
            if grep -q "^GEMINI_MODEL=" .env; then
              sed -i 's/^GEMINI_MODEL=.*/GEMINI_MODEL=gemini-2.0-flash-lite/' .env
              echo "Updated existing GEMINI_MODEL"
            else
              echo "GEMINI_MODEL=gemini-2.0-flash-lite" >> .env
              echo "Added GEMINI_MODEL"
            fi
            grep "GEMINI_MODEL" .env
            echo "=== RESTARTING APP ==="
            docker compose restart app
            sleep 5
            docker logs trivio-app-1 --tail 10 2>&1
