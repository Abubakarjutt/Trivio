name: Check Gemini env + API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker exec trivio-app-1 node -e "
            const key = process.env.GEMINI_API_KEY;
            const models = ['gemini-2.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-2.5-flash'];
            async function test(model) {
              const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + key;
              try {
                const r = await fetch(url, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ contents: [{ parts: [{ text: 'Reply with just: OK' }] }], generationConfig: { temperature: 0, maxOutputTokens: 10 } }),
                  signal: AbortSignal.timeout(20000)
                });
                const d = await r.json();
                const t = (d.candidates?.[0]?.content?.parts ?? []).filter(p=>!p.thought).map(p=>p.text??'').join('');
                console.log(model + ': status=' + r.status + ' text=' + t.trim());
              } catch(e) { console.log(model + ': ERROR ' + e.message); }
            }
            (async()=>{ for(const m of models) await test(m); })();
            " 2>&1
