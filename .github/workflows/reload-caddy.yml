name: Reload Caddy

on:
  workflow_dispatch:

jobs:
  reload:
    name: Reload Caddy config
    runs-on: ubuntu-latest
    steps:
      - name: Reload via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/trivio
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate caddy
            echo "Caddy container restarted"
            sleep 3
            curl -sI -H "Host: trivio-ai.com" http://localhost/blog/ | head -5
