name: Debug App

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== DOCKER CONTAINER STATUS ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.RestartCount}}"
            echo ""
            echo "=== VPS MEMORY ==="
            free -m
            echo ""
            echo "=== APP RESTART COUNT ==="
            docker inspect trivio-app-1 --format '{{.RestartCount}} restarts | State: {{.State.Status}} | OOMKilled: {{.State.OOMKilled}}' 2>/dev/null || echo "Container not found"
            echo ""
            echo "=== APP LOGS (last 100 lines) ==="
            docker logs trivio-app-1 --tail 100 2>&1
            echo ""
            echo "=== CADDY ERROR LOGS (errors only, last 30 lines) ==="
            docker logs trivio-caddy-1 --tail 200 2>&1 | grep -v "health_checker" | tail -30
            echo ""
            echo "=== CURL app.trivio-ai.com FROM INSIDE VPS (via HTTP, Host header) ==="
            curl -sI -H "Host: app.trivio-ai.com" http://localhost/ | head -10
            echo ""
            echo "=== CURL app.trivio-ai.com/api/health (HTTPS, skip verify) ==="
            curl -sfk https://app.trivio-ai.com/api/health 2>&1 && echo " <- HEALTH OK" || echo "HEALTH FAILED"
            echo ""
            echo "=== HEALTH CHECK DIRECT TO APP CONTAINER ==="
            curl -sf http://localhost:3003/api/health && echo " <- DIRECT OK" || echo "DIRECT FAILED"
            echo ""
            echo "=== CADDY ADMIN API CONFIG (app upstream) ==="
            docker exec trivio-caddy-1 wget -qO- http://localhost:2019/config/ 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" 2>/dev/null | grep -A5 "upstreams\|dial\|app:" | head -30 || echo "Admin API parse failed"
