<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Trivio — Accounting, made simple">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="180" cy="120" rx="520" ry="360" fill="url(#glowBlue)"/>
  <ellipse cx="1040" cy="260" rx="460" ry="320" fill="url(#glowIndigo)"/>

  <!-- mark + wordmark, centered as a group -->
  <g transform="translate(452,94)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.45"/>
    <g stroke="#93c5fd" stroke-linecap="round" fill="none">
      <path d="M12 17h28" stroke-width="2.4"/>
      <path d="M12 26h18" stroke-width="2.4"/>
      <path d="M12 35h9" stroke-width="2.4"/>
      <circle cx="40" cy="31" r="4.2" stroke-width="1.8"/>
      <path d="M40 28.4v2.6l1.4 1.4" stroke-width="1.5"/>
    </g>
    <text x="70" y="42" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">Trivio</text>
    <rect x="71" y="52" width="150" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Accounting, made simple.</text>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
    <g transform="translate(329,236)">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="59" y="19.5" text-anchor="middle">Open source</text>
    </g>
    <g transform="translate(459,236)">
      <rect x="0" y="0" width="128" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="64" y="19.5" text-anchor="middle">Double-entry</text>
    </g>
    <g transform="translate(589,236)">
      <rect x="0" y="0" width="128" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="64" y="19.5" text-anchor="middle">AI extraction</text>
    </g>
    <g transform="translate(729,236)">
      <rect x="0" y="0" width="132" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="66" y="19.5" text-anchor="middle">Web + macOS</text>
    </g>
  </g>
</svg>
