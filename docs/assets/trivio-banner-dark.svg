<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Trivio — Accounting, made simple">
  <defs>
    <linearGradient id="bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glowBlue-d" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo-d" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid-d" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg-d)"/>
  <rect width="1200" height="300" fill="url(#grid-d)"/>
  <ellipse cx="170" cy="115" rx="520" ry="360" fill="url(#glowBlue-d)"/>
  <ellipse cx="1050" cy="255" rx="460" ry="320" fill="url(#glowIndigo-d)"/>

  <!-- mark: a two-column ledger, balanced at its base -->
  <g transform="translate(490,90)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.45"/>
    <line x1="26" y1="10" x2="26" y2="40" stroke="#e2e8f0" stroke-opacity="0.30" stroke-width="1.5"/>
    <g stroke-linecap="round">
      <path d="M10 17h11" stroke="#93c5fd" stroke-width="2.2"/>
      <path d="M10 24h11" stroke="#93c5fd" stroke-width="2.2"/>
      <path d="M10 31h8" stroke="#93c5fd" stroke-width="2.2"/>
      <path d="M31 17h11" stroke="#60a5fa" stroke-width="2.2"/>
      <path d="M31 24h11" stroke="#60a5fa" stroke-width="2.2"/>
      <path d="M31 31h8" stroke="#60a5fa" stroke-width="2.2"/>
    </g>
    <circle cx="26" cy="45" r="2.3" fill="#60a5fa"/>
    <text x="70" y="42" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">Trivio</text>
    <rect x="71" y="52" width="150" height="3" rx="1.5" fill="url(#accent-d)"/>
  </g>

  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Accounting, made simple.</text>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
    <g transform="translate(350,236)">
      <rect x="0" y="0" width="108" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="54" y="19.5" text-anchor="middle">Open source</text>
    </g>
    <g transform="translate(472,236)">
      <rect x="0" y="0" width="116" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="58" y="19.5" text-anchor="middle">Double-entry</text>
    </g>
    <g transform="translate(602,236)">
      <rect x="0" y="0" width="124" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="62" y="19.5" text-anchor="middle">AI extraction</text>
    </g>
    <g transform="translate(740,236)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="55" y="19.5" text-anchor="middle">Web + macOS</text>
    </g>
  </g>
</svg>
