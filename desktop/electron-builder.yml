# Trivio — electron-builder packaging config
#
# Produces a native macOS .app + .dmg + .zip. The .app bundles:
#   - the compiled Electron main/preload (desktop/dist/*.cjs)
#   - the self-contained Next.js server tree (desktop/dist-server -> Resources/app-server)
#   - hardened-runtime + notarization support when credentials are present
#
# Build order (run `npm run build:desktop`), which invokes this file:
#   next build -> desktop/assemble-server.mjs -> desktop/build-electron.mjs -> electron-builder
#
# Sign & notarize (optional, only when shipping): set env vars at build time.
#   CSC_NAME / CSC_LINK / CSC_KEY_PASSWORD          developer identity (or .p12)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarytool
# electron-builder consumes these automatically; without them the app is
# ad-hoc signed and will show a Gatekeeper "unidentified developer" warning.

appId: com.trivio.desk
productName: Trivio
copyright: Copyright © 2025 Trivio

# Register the trivio:// deep-link scheme in the macOS app so the OS routes
# trivio://... URLs (e.g. trivio://settings, trivio://update) to Trivio. main.ts
# registers it as privileged and handles open-url / second-instance at runtime.
protocols:
  - name: Trivio
    schemes:
      - trivio

directories:
  output: release
  buildResources: desktop/build
  app: desktop

# Ship only the compiled shell + its manifest; the server is pulled in via
# extraResources (the assembled app-server tree) instead of the huge Next.js
# node_modules, keeping the .app small and fast.
files:
  - dist/main.cjs
  - dist/preload.cjs

# The runnable Next.js server, laid down next to the app resources. main.cjs
# boots it from Contents/Resources/app-server via the ELECTRON_RUN_AS_NODE trick.
extraResources:
  - from: desktop/dist-server
    to: app-server
    filter:
      - "**/*"
      - "!.env"
      - "!**/.env"
      # The embedded PostgreSQL engine (fetched by `npm run fetch:pg`).
      # resolvePostgresBinaries looks for <resourcesPath>/postgres/bin at runtime,
      # so this must mirror the on-disk engine layout (bin/ + lib/ siblings).
  - from: desktop/embedded
    to: postgres
    filter:
      - "bin/**/*"
      - "lib/**/*"
      - "VERSION"
      - "MANIFEST.json"
      - "!**/.DS_Store"

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  title: "${productName}"
  contents:
    - x: 140
      y: 160
    - x: 420
      y: 160
      type: link
      path: /Applications

mac:
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.inherit.plist
  icon: desktop/build/icon.icns
  # Apple Silicon first (build host is arm64). To add an x64 target, run
  # `prisma generate` with the x64 query engine, then add `- x64` below or use
  # target universal (requires both engine archs).
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

# ── Windows ────────────────────────────────────────────────────────────────────
# A native Windows installer (NSIS setup.exe) + a no-install portable build. The
# same shell boots the embedded server + embedded Postgres; on Windows the PG
# engine is the native EDB build (initdb.exe / postgres.exe + DLLs in bin/).
#
# Cross-building: a *thin-client* (DESKTOP_MODE=remote) Windows binary can be
# produced on any host (the Electron shell is cross-platform). A *local*
# (embedded-Postgres) Windows binary needs the native Windows engine under
# desktop/embedded/bin, which only a Windows runner can fetch/test.
win:
  icon: desktop/build/icon.ico
  # No publisher / certificate here by default: an unsigned build runs but
  # Windows SmartScreen will show a "protected your PC" warning until you add a
  # code-signing cert (CSC_LINK = base64 .pfx + CSC_KEY_PASSWORD). When those
  # are set electron-builder signs the .exe / .nsis automatically.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

# NSIS: a real (non-one-click) installer with a progress bar and an uninstaller.
# perMachine:false installs per-user (no admin needed). The embedded database
# lives in the per-user AppData dir (userData), so it is preserved on uninstall
# (deleteAppDataOnUninstall stays false — we never wipe the user's data).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Trivio

# The portable build is a single self-contained .exe (no installer, no write to
# Program Files); ideal for trying the app or running from a USB stick.
portable:
  artifactName: "${productName}-${version}-win-${arch}-portable.${ext}"
